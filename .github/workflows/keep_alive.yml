name: Keep Streamlit App Awake

on:
  schedule:
    # Chạy mỗi 3 tiếng cả ngày lẫn đêm (00:18, 03:18, 06:18, 09:18, 12:18, 15:18, 18:18, 21:18 UTC)
    # Streamlit Cloud chỉ rơi vào trạng thái ngủ khi không có traffic sau 72 giờ liên tục.
    # Ping định kỳ mỗi 3 tiếng đảm bảo app KHÔNG BAO GIỜ bị ngủ đông (Sleep).
    - cron: '18 */3 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub Actions bất kỳ lúc nào

jobs:
  ping-keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GHN B2B Streamlit App
        run: |
          echo "Pinging https://ghn-b2b.streamlit.app/ ..."
          status_code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 https://ghn-b2b.streamlit.app/ || true)
          echo "HTTP Status Code: $status_code"
          if [ "$status_code" = "200" ] || [ "$status_code" = "303" ]; then
            echo "Success: App is active and awake!"
          else
            echo "App pinged with response code: $status_code"
          fi
          # Ping backup Render bot
          curl -sL --max-time 15 https://b2b-ton-bot.onrender.com > /dev/null || true
          echo "Keep-alive ping completed."
