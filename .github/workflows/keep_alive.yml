name: Keep Streamlit App Awake

on:
  schedule:
    # Chạy mỗi 2 tiếng liên tục 24/7 (00:20, 02:20, 04:20, 06:20, 08:20, 10:20, 12:20, 14:20, 16:20, 18:20, 20:20, 22:20 UTC)
    # Tự động mở trình duyệt headless Playwright truy cập https://ghn-b2b.streamlit.app
    # Nếu app bị ngủ đông, script sẽ tự động click nút "Yes, get this app back up!" để đánh thức app ngay lập tức.
    - cron: '20 */2 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub Actions bất kỳ lúc nào

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Playwright Keep-Awake Bot
        run: |
          python keep_awake.py

      - name: Ping Backup Services
        run: |
          curl -sL --max-time 15 https://b2b-ton-bot.onrender.com > /dev/null || true
          echo "Keep-alive finished successfully."
