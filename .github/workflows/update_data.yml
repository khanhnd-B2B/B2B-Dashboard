name: Auto Update B2B Data

on:
  schedule:
    # Chạy 3 lần mỗi ngày theo giờ VN (UTC+7): 08:30 (01:30 UTC), 12:30 (05:30 UTC), 18:30 (11:30 UTC)
    - cron: '30 1,5,11 * * *'
  workflow_dispatch: # Cho phep bam chay thu cong tren GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Run daily_update.py
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: python daily_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "Data B2B Master.xlsx" advisor_config.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update data from Google Sheets [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          else
            echo "No changes to commit"
          fi

      - name: Reboot Streamlit App via API
        env:
          STREAMLIT_API_TOKEN: ${{ secrets.STREAMLIT_API_TOKEN }}
          STREAMLIT_APP_ID: ${{ secrets.STREAMLIT_APP_ID }}
        run: |
          if [ -n "$STREAMLIT_API_TOKEN" ] && [ -n "$STREAMLIT_APP_ID" ]; then
            echo "Rebooting Streamlit App after data update..."
            curl -X POST \
              "https://api.streamlit.io/v1/apps/$STREAMLIT_APP_ID/reboot" \
              -H "Authorization: Bearer $STREAMLIT_API_TOKEN" \
              -H "Content-Type: application/json" \
              --silent --show-error || true
            echo "Reboot request sent."
          fi

      - name: Send Daily Telegram Report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py

      - name: Ping Streamlit Dashboard & Render Bot (Keep Awake)
        run: |
          curl -sL https://b2b-dashboard-dsgkivhypxmlqtjujsic2d.streamlit.app > /dev/null || true
          curl -sL https://b2b-dashboard-hydt.streamlit.app > /dev/null || true
          curl -sL https://b2b-ton-bot.onrender.com > /dev/null || true
          echo "Streamlit dashboard and Render Bot pinged."
