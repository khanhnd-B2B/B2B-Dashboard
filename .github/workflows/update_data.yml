name: Auto Update B2B Data

on:
  schedule:
    # 08:30 AM Vietnam time (UTC+7) = 01:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch: # Cho phep bam chay thu cong tren GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Create token.json from secret
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          if [ -n "$GOOGLE_TOKEN" ]; then
            echo "$GOOGLE_TOKEN" > token.json
          fi

      - name: Run daily_update.py
        run: python daily_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "Data B2B Master.xlsx"
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update data from Google Sheets [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
