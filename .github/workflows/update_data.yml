name: Auto Update B2B Data

on:
  schedule:
    # Chạy mỗi 2 tiếng trong ngày (giờ VN từ 08:15 đến 22:15): 01:15, 03:15, 05:15, 07:15, 09:15, 11:15, 13:15, 15:15 UTC
    # Phút 15 tránh tắc nghẽn hàng đợi GitHub Actions (vốn hay bị nghẽn ở phút 00 và 30)
    - cron: '15 1,3,5,7,9,11,13,15 * * *'
  workflow_dispatch: # Cho phep bam chay thu cong tren GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Create token.json from secret
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          if [ -n "$GOOGLE_TOKEN" ]; then
            echo "$GOOGLE_TOKEN" > token.json
          fi

      - name: Run daily_update.py
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: python daily_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "Data B2B Master.xlsx"
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update data from Google Sheets [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          else
            echo "No changes to commit"
          fi

      - name: Send Daily Telegram Report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py

      - name: Ping Streamlit Dashboard & Render Bot (Keep Awake)
        run: |
          curl -sL https://b2b-dashboard-hydt.streamlit.app > /dev/null || true
          curl -sL https://b2b-ton-bot.onrender.com > /dev/null || true
          echo "Streamlit dashboard and Render Bot pinged."
