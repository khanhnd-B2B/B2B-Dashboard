name: Keep Streamlit Dashboard Awake

on:
  schedule:
    # Ping every 6 hours to prevent Streamlit from sleeping
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Dashboard
        run: |
          curl -sL https://b2b-dashboard-hydt.streamlit.app > /dev/null || true
          echo "Pinged Streamlit dashboard successfully"
